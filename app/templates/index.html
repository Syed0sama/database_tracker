<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

  <script src="{{ url_for('static', filename='js/4-0-10-l1-select2-min.js') }}"></script>

  <script src="{{ url_for('static', filename='js/4-0-8-select2-min.js') }}" defer></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.10/css/select2.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/select2-min.css') }}" rel="stylesheet" />


  <script>
    $(document).ready(function () { $("#comp").select2(); });
    $(document).ready(function () { $("#sub_comp").select2(); });
    $(document).ready(function () { $("#release").select2(); });
    $(document).ready(function () { $("#product").select2(); });
  </script>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700,900&display=swap" rel="stylesheet">




  <!-- Bootstrap CSS -->



  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="shortcut icon" type="image/jpg" href="{{ url_for('static', filename='images/logo.png') }}">

  <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />


  <title>Almosfer</title>
</head>

<body>
  <div id="logo">
    <img src="/static/images/nobgalmo.png" height="150px" alt="sorry">
  </div>
  <div class="row">
    <div class="col-6">

      <div id="text">
        <div id="heading">
          <h1 style="font-family:Roboto, sans-serif;">Database Access   &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp Tracker!</h1>
        </div>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <div class="summary">

          <form action="{{ url_for('summ') }}" method="post">
            <button name="summary" type="submit" class="btn btn-success btn-lg btn-block">&nbsp &nbsp &nbsp &nbsp &nbsp
              &nbsp
              Record &nbsp &nbsp &nbsp &nbsp &nbsp </button> <br>
          </form>

          <p><u><b>Click to view Full Record</b></u> </p>




        </div>



        <div id="outPopUp">

          <form action="{{ url_for('ranges') }}" method="post">

            <label for="From"><b> From </b></label><br>
            <input type="date" id="from_date" name="from_date"><br><br>


            <label for="To"> <b> To </b></label> <br>
            <input type="date" id="to_date" name="to_date">


            <br>
            <br>
            <button name="range" type="submit" class="btn btn-success btn-lg btn-block">&nbsp &nbsp &nbsp &nbsp &nbsp
              &nbsp
              Range &nbsp &nbsp &nbsp &nbsp &nbsp </button> <br>
          </form>

          <p><u><b>Select Time Range </b></u> </p>




        </div>





      </div>

    </div>

    <br><br>
    <div id="forum" class="col-6">
      <form class="form" method="POST" action="{{ url_for('test') }}">

        <label><b> Username </b> </label><br>
        <select class="form-select form-select-sm" aria-label=".form-select-sm example" id="sub_comp" name="sub_comp"
          id="sub_comp" name="sub_comp" onchange="disable()">
          {% for sub_comp in user_name %}

          <option value="{{sub_comp['username']}}">{{sub_comp['username']}}</option>
          {% endfor %}
        </select>
        <br><br>

        <label> <b> Hostname </b></label><br>
        <select class="form-select form-select-sm" aria-label=".form-select-sm example" id="comp" name="comp"
          onchange="disable()">
          {% for comp in host_names %}

          <option value="{{comp['host']}}">{{comp['host']}}</option>
          {% endfor %}
        </select>

        <br><br>


        <label> <b> DBs </b></label><br>
        <select class="form-select form-select-sm" aria-label=".form-select-sm example" id="release" name="release"
          onchange="disable()">
          {% for rel in db_names %}

          <option value="{{rel['dbnames']}}">{{rel['dbnames']}}</option>
          {% endfor %}
        </select>
        <br><br>


        <label> <b> Tool </b></label>
        <select class="form-select form-select-sm" aria-label=".form-select-sm example" id="tool" name="tool"
          onchange="disable()">
          {% for tools in tool %}

          <option value="{{tools['tool']}}">{{tools['tool']}}</option>
          {% endfor %}
        </select>
        <br>


        <label> <b> Status </b></label>
        <select class="form-select form-select-sm" aria-label=".form-select-sm example" id="status" name="status"
          onchange="disable()">
          {% for statuses in status %}

          <option value="{{statuses['status']}}">{{statuses['status']}}</option>
          {% endfor %}
        </select>
        <br>


        <label> <b> isActive </b></label>
        <select class="form-select form-select-sm" aria-label=".form-select-sm example" id="isActive" name="isActive"
          onchange="disable()">
          {% for isActives in isActive %}

          <option value="{{isActives['isActive']}}">{{isActives['isActive']}}</option>
          {% endfor %}
        </select>
        <br><br>


        <div id="button">
          <button type="submit" class="btn btn-success btn-lg btn-block">&nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp
            &nbsp
            Submit &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp</button>
        </div>
      </form>
    </div>
    <div>
      {{table_data | safe}}
    </div>




  </div>
  </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <script>
    function disable() {
      let comp = document.getElementById("comp");
      let sub_comp = document.getElementById("sub_comp");
      let release = document.getElementById("release");
      let product = document.getElementById("product");
      let latest = document.getElementById("latest");


      console.log(comp.value, sub_comp.value, product.value, release.value, latest.value)
      if (comp.value == "all" && latest.value == "true") {
        document.getElementById("latest").value = false;
        console.log("I am in if")
      }
      else if (comp.value !== "all" || sub_comp.value !== "all" && latest.value == "false") {

        console.log("I am in else")
      }

    }



  </script>

</body>

</html>
